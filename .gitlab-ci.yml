include:
  - component: $CI_SERVER_FQDN/biru/project-components/merge-branches@1.0.0
    inputs:
      dev-branch: main
      token: $DEV_TOKEN
  - component: $CI_SERVER_FQDN/biru/project-components/release@1.0.0
    inputs:
      token: $DEV_TOKEN
  - component: $CI_SERVER_FQDN/biru/project-components/build-deploy@1.0.0
    inputs:
      project-name: tenzu
      application-name: api
      dockerfile: buildrun/docker/tenzu/Dockerfile
      target: production-image
      build-arg: 'EXTRA_PACKAGES=${EXTRA_PACKAGES}'

  # mirror
  - component: $CI_SERVER_FQDN/biru/component/push@v1.16.0
    inputs:
      repo: github.com/BIRU-Scop/tenzu-back.git
      fetch-args: "origin --no-tags"
      rules:
        - if: '$CI_COMMIT_MESSAGE =~ /^chore\(release\).*/'
          when: never
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
  - component: $CI_SERVER_FQDN/biru/component/push@v1.16.0
    inputs:
      repo: github.com/BIRU-Scop/tenzu-back.git
      job-name: mirror-tags
      push-args: "origin HEAD:refs/tags/$CI_COMMIT_REF_NAME"
      fetch-args: "origin --no-tags"
      rules:
        - if: $CI_COMMIT_TAG
  # add test build image
  - component: $CI_SERVER_FQDN/biru/component/build-and-push@v1.16.0
    inputs:
      stage: build
      context: ${CI_PROJECT_DIR}
      dockerfile: ${CI_PROJECT_DIR}/buildrun/docker/tenzu/Dockerfile
      target: dev-image
      prefix: test-
      build-arg: 'EXTRA_PACKAGES=${EXTRA_PACKAGES}'
      destination: ${CI_REGISTRY_IMAGE}/test:${CI_COMMIT_REF_SLUG}
      rules:
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && ($CI_COMMIT_REF_PROTECTED == "false" || $CI_COMMIT_REF_SLUG == $CI_DEFAULT_BRANCH)'
          changes:
            - "buildrun/docker/tenzu/Dockerfile"
            - "buildrun/docker/tenzu/requirements/devel.txt"
            - "src/scripts/package-lock.json"
            - ".gitlab-ci.yml"

stages:
  - build
  - test
  - release
  - build-deploy
  - mirror
  - merge


launch-demo-deploy:
  stage: merge
  variables:
    GIT_STRATEGY: none
    GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
  needs:
    - job: tag-and-changelog
    - job: build-image-and-push
  before_script:
    - git clone https://oauth2:$DEPLOY_TOKEN@${CI_SERVER_HOST}/biru/sre/argocd -b main
    - cd argocd
    - git config --local user.email "bot@biru.sh"
    - git config --local user.name "Bot Biru"
    - git fetch --all
  script:
    # construct the values path with the inputs value
    - PROJECT_NAME="tenzu"
    - APP_NAME="api"
    - ENV_NAME="demo"
    - VALUES_FOLDER="values"
    - FILE="$VALUES_FOLDER/$PROJECT_NAME/$APP_NAME/values-$ENV_NAME.yaml"
    - echo $FILE $VALUE $NEXT_VERSION
    - yq -i ".image.tag=\"$NEXT_VERSION\"" "$FILE"
    - git add $FILE
    - git commit -m "deploy($PROJECT_NAME/$APP_NAME) $NEXT_VERSION on $ENV_NAME"
    - git push origin HEAD:main
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /^chore\(release\).*/ '
      when: never
    - if: '$CI_COMMIT_BRANCH == "staging"'
      when: manual
  environment:
    name: demo

publish-demo-tag:
  stage: merge
  needs:
    - job: tag-and-changelog
    - job: build-image-and-push
    - job: launch-demo-deploy
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /^chore\(release\).*/ '
      when: never
    - if: '$CI_COMMIT_BRANCH == "staging"'
  before_script:
    - git config --global user.email "bot@biru.sh"
    - git config --global user.name "${CI_PROJECT_TITLE}-bot"
    - git remote set-url origin https://oauth2:$DEV_TOKEN@${CI_SERVER_HOST}/${CI_PROJECT_PATH}
    - git fetch
  script:
    - DEMO_TAG="${NEXT_VERSION//staging/demo}"
    - echo $DEMO_TAG
    - git push origin HEAD:refs/tags/$DEMO_TAG

test-env:
  stage: build
  script:
    - echo OK
  artifacts:
    reports:
      dotenv: $CI_PROJECT_DIR/buildrun/docker/tenzu/test.env
  rules:
    - if: '$CI_COMMIT_REF_SLUG == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_REF_PROTECTED == "false" && $CI_PIPELINE_SOURCE == "merge_request_event"'
.test-db:
  stage: test
  image:
    name: ${CI_REGISTRY_IMAGE}/test:${CI_COMMIT_REF_SLUG}
    pull_policy: [ always, if-not-present ]
  services:
    - name: postgres:17
      alias: tenzu-db
      variables:
        HEALTHCHECK_TCP_PORT: "5432"
  variables:
    # Postgres service config
    POSTGRES_DB: tenzu
    POSTGRES_USER: tenzu
    POSTGRES_PASSWORD: tenzu
    POSTGRES_HOST_AUTH_METHOD: trust
  rules:
    - if: '$CI_COMMIT_REF_SLUG == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_REF_PROTECTED == "false" && $CI_PIPELINE_SOURCE == "merge_request_event"'
  dependencies:
    - test-env
  before_script: &wait-db
    - cd $CI_PROJECT_DIR/src/
    - |
      python manage.py shell <<'EOF'
      import time
      from django.db import connection
      from django.db.utils import OperationalError

      deadline = time.monotonic() + 60
      while True:
          try:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT 1")
              break
          except OperationalError as e:
              if time.monotonic() > deadline:
                  raise SystemExit(f"database not ready: {e}")
              time.sleep(1)
      EOF

test:
  extends: .test-db
  cache:
    key:
      files:
        - src/scripts/package-lock.json
    paths:
      - .npm/
  before_script:
    - *wait-db
    - cd $CI_PROJECT_DIR/src/scripts && npm ci --cache .npm --prefer-offline
    - cd $CI_PROJECT_DIR/src/
  script:
    - cd $CI_PROJECT_DIR/src/
    - ./manage.py compilemessages
    - pytest . --cov --cov-report=xml:coverage-report.xml  --cov-report=term --no-cov-on-fail --junitxml=pytest-report.xml --cov-config=.coveragerc
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    reports:
      junit: $CI_PROJECT_DIR/src/pytest-report.xml
      coverage_report:
        coverage_format: cobertura
        path: $CI_PROJECT_DIR/src/coverage-report.xml
check_migration:
  extends: .test-db
  script:
    - cd $CI_PROJECT_DIR/src/
    - python manage.py makemigrations --check

